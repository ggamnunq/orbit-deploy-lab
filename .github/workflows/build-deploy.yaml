name: build-deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"

permissions:
  contents: write   # dev overlay 태그 변경 커밋·푸시
  packages: write   # GHCR 푸시

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image vars
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER }}/orbit-api:${{ env.TAG }}

      - name: Update dev overlay image
        working-directory: k8s/overlays/dev
        run: kustomize edit set image orbit-api=ghcr.io/${OWNER}/orbit-api:${TAG}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "dev: orbit-api ${TAG}"
          git push
