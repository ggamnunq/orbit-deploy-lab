apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orbit-dev
resources:
- namespace.yaml
- ../../base
images:
- name: orbit-api
  newName: ghcr.io/ggamnunq/orbit-api
  newTag: 2d416aa
replicas:
- name: orbit-api
  count: 2
configMapGenerator:
- behavior: merge
  literals:
  - APP_ENV=dev
  - LOG_LEVEL=debug
  name: orbit-config
patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: dev.orbit.local
  target:
    kind: Ingress
    name: orbit-api
