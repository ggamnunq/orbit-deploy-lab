apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orbit-prod
resources:
- namespace.yaml
- ../../base
replicas:
- name: orbit-api
  count: 3
images:
- name: orbit-api
  newName: nginx
  newTag: "1.26"
configMapGenerator:
- name: orbit-config
  behavior: merge
  literals:
  - APP_ENV=prod
  - LOG_LEVEL=warn
patches:
- path: resources-patch.yaml
- target:
    kind: Ingress
    name: orbit-api
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: api.orbit.local