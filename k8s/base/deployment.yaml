apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-api
  labels:
    app: orbit-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbit-api
  template:
    metadata:
      labels:
        app: orbit-api
    spec:
      containers:
      - name: api
        image: orbit-api
        ports:
        - name: http
          containerPort: 80
        envFrom:
        - configMapRef:
            name: orbit-config
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi